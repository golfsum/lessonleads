<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LessonLeads embed test</title>
    <style>
      body { font-family: Georgia, serif; margin: 0; background: #f4f1ea; color: #1b2a22; }
      header { padding: 28px 8vw; background: #1b552c; color: #fff; }
      main { padding: 32px 8vw 120px; max-width: 720px; }
      h1 { font-size: 2rem; }
      p { line-height: 1.5; }
    </style>
  </head>
  <body>
    <header>
      <p>Example coach website</p>
      <h1>Desert Fairways Golf Academy</h1>
    </header>
    <main>
      <p>This page is a stand-in for a coach's WordPress or Squarespace site. The LessonLeads widget loads from one script tag.</p>
      <p>Ask about a driver slice, online lessons, or upload a swing.</p>
      <div id="lessonleads-widget"></div>
    </main>
    <script src="/widget.js" data-coach="demo-mike" data-mode="inline" async></script>
  </body>
</html>
